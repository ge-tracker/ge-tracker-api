name: CI/CD (@next)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+-[0-9]+'

jobs:
  tests:
    strategy:
      matrix:
        node: [20]
    uses: ./.github/workflows/service_tests.yml
    with:
      node-version: ${{ matrix.node }}
    secrets: inherit

  publish:
    needs: [tests]
    name: Publish @next
    uses: ./.github/workflows/service_publish.yml
    with:
      tag: next
    secrets: inherit
